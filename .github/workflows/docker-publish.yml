name: Docker Build and Publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/openclaw

jobs:
  build-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve mutable tag targets
        id: mutable
        run: |
          git fetch --tags --quiet

          # Highest stable semver (no pre-release suffix)
          LATEST_TAG=$(git tag --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -1)

          # Highest beta semver (only -beta suffix, not -alpha, -rc)
          BETA_TAG=$(git tag --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-beta(\.[0-9]+)?$' \
            | head -1)

          CURRENT_REF="${{ github.ref_name }}"

          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "beta_tag=${BETA_TAG}" >> $GITHUB_OUTPUT

          # Set booleans for enable= expressions
          if [ "$CURRENT_REF" = "$LATEST_TAG" ]; then
            echo "is_latest_target=true" >> $GITHUB_OUTPUT
          else
            echo "is_latest_target=false" >> $GITHUB_OUTPUT
          fi

          if [ "$CURRENT_REF" = "$BETA_TAG" ]; then
            echo "is_beta_target=true" >> $GITHUB_OUTPUT
          else
            echo "is_beta_target=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ steps.mutable.outputs.is_latest_target }}
            type=raw,value=beta,enable=${{ steps.mutable.outputs.is_beta_target }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  build-dev:
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=dev

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  sync-readme:
    needs: [build-release, build-dev]
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'pull_request' && (needs.build-release.result == 'success' || needs.build-release.result == 'skipped') && (needs.build-dev.result == 'success' || needs.build-dev.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if README exists
        id: readme-check
        run: |
          if [ -f README.md ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "README.md not found - skipping sync"
          fi

      - name: Sync README to Docker Hub
        if: steps.readme-check.outputs.exists == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PW }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/openclaw
          readme-filepath: ./README.md
